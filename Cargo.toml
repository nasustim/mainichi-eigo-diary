[package]
name = "mainichi-eigo-diary"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "=0.23.0", features = ["csr"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
gloo-storage = "=0.4.0"
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Navigator",
    "ProgressEvent",
    "Url",
    "Window",
] }
